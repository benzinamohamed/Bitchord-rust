[package]
name = "bitchord"
version = "0.1.0"
edition = "2021"
authors = ["BitChord Rust Team"]
description = "Aesthetic YouTube Music Desktop Client for Arch Linux"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image", "all_loaders"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
regex = "1.10"
url = "2.5"
open = "5.3"
