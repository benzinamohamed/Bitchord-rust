[package]
name = "bitchord"
version = "0.1.0"
edition = "2021"
authors = ["BitChord Rust Team"]
description = "Aesthetic YouTube Music Desktop Client for Arch Linux"
license = "GPL-3.0"

[dependencies]
tauri = { version = "2", features = [] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
regex = "1.10"
url = "2.5"
open = "5.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
